groups:
- name: wiseq-hermes-alerts
  rules:
  - alert: HighCPUUsage
    expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage on {{ $labels.instance }}"
      description: "CPU usage is {{ $value }}% for more than 5 minutes"

  - alert: HighMemoryUsage
    expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High memory usage on {{ $labels.instance }}"
      description: "Memory usage is {{ $value }}% for more than 5 minutes"

  - alert: APIHighErrorRate
    expr: (rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])) * 100 > 5
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "High API error rate on {{ $labels.instance }}"
      description: "API error rate is {{ $value }}% for more than 5 minutes"

  - alert: APIHighLatency
    expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High API latency on {{ $labels.instance }}"
      description: "API 95th percentile latency is {{ $value }}s for more than 5 minutes"

  - alert: DatabaseConnectionErrors
    expr: rate(sql_errors_total[5m]) > 0
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: "Database connection errors on {{ $labels.instance }}"
      description: "Database error rate is {{ $value }} errors per minute"

  - alert: RedisConnectionErrors
    expr: rate(redis_connections_errors_total[5m]) > 0
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: "Redis connection errors on {{ $labels.instance }}"
      description: "Redis error rate is {{ $value }} errors per minute"

  - alert: LowDiskSpace
    expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 20
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Low disk space on {{ $labels.instance }}"
      description: "Disk space is {{ $value }}% available on {{ $labels.instance }}"

  - alert: ServiceDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Service {{ $labels.instance }} is down"
      description: "{{ $labels.instance }} has been down for more than 1 minute"